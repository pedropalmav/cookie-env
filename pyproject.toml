[project]
name = "cookie-env"
version = "0.7.0"
description = "MiniGrid-based environments (cookie rooms, corridors, latent-goal navigation)"
readme = "README.md"
requires-python = ">=3.11"
# Lower bounds only, and only on what `cookie_env` actually imports. This list
# used to be a frozen dev environment (copier, dunamai, questionary, plumbum,
# pydantic, ... — none of them imported here), and its exact `==` pins forced
# downgrades on every consumer. Reproducible dev versions live in requirements.txt
# and uv.lock; a library must not dictate its consumers' transitive tree.
#
# The floors are the oldest versions cookie_env is known to run on, not the
# newest it has been developed against. her-dream pins numpy==1.26.0 and
# gymnasium==1.2.1; the previous >=2.0 / >=1.2.2 made that set unresolvable
# while the test suite passes on it untouched, so the bounds were the only
# thing in the way.
dependencies = [
    "gymnasium>=1.2.1",
    "minigrid>=3.0.0",
    "numpy>=1.26.0",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cookie_env"]
