dependencies = [
    "annotated-types==0.7.0",
    "cloudpickle==3.1.2",
    "colorama==0.4.6",
    "copier==9.10.3",
    "dunamai==1.25.0",
    "farama-notifications==0.0.4",
    "funcy==2.0",
    "gymnasium==1.2.2",
    "jinja2==3.1.6",
    "jinja2-ansible-filters==1.3.2",
    "markupsafe==3.0.3",
    "minigrid==3.0.0",
    "numpy==2.3.4",
    "packaging==25.0",
    "pathspec==0.12.1",
    "platformdirs==4.5.0",
    "plumbum==1.10.0",
    "prompt-toolkit==3.0.52",
    "pydantic==2.12.4",
    "pydantic-core==2.41.5",
    "pygame==2.6.1",
    "pygments==2.19.2",
    "pyyaml==6.0.3",
    "questionary==2.1.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "wcwidth==0.2.14",
